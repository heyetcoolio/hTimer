# Tarih formatı: YYYY-AA-GG SS:DD (Yıl-Ay-Gün Saat:Dakika)

counters:
  # TİP 1: Sabit Tarihli Sayaç (Bitiş tarihi bellidir, bir kere çalışır)
  sezon_bitis:
    type: "FIXED" # Sabit
    date: "2026-06-29 15:00" # YYYY-MM-dd HH:mm
    end-message: "&cSezon bitti geçmiş olsun!"
    commands:
      - "broadcast &4Sezon bitti sunucu kapanıyor..."
      - "whitelist on"

  # TİP 2: Haftalık Tekrarlayan Sayaç (Her hafta aynı gün/saat)
  haftalik_event:
    type: "WEEKLY" # Haftalık
    day: "SUNDAY"  # Günler: MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY
    time: "20:00"  # Saat:Dakika (24 saatlik format)
    end-message: "&bHAFTALIK EVENT BAŞLADI!"
    commands:
      - "broadcast &a&lHER PAZAR EVENTİ BAŞLADI! KOŞ!"
      - "eco give * 1000"

  bakim_gunu:
    type: "WEEKLY"
    day: "FRIDAY"
    time: "03:00"
    end-message: "&eOtomatik bakım zamanı."
    commands:
      - "save-all"
      - "say Sunucu yedekleniyor..."

messages:
  prefix: "&8[&6hTimer&8] &r"
  reload: "&aYapılandırma yenilendi, sayaçlar tekrar hesaplandı."


